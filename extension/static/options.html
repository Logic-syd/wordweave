<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语境 · 设置</title>
    <link rel="stylesheet" href="ui.css" />
    <script src="options.js" type="module"></script>
  </head>
  <body class="options">
    <main class="settings-card">
      <header class="brand">
        <img src="icons/icon-48.png" width="48" height="48" alt="" />
        <div>
          <h1>想怎么翻译？</h1>
          <p>默认免费，装好就能用。</p>
        </div>
      </header>
      <form id="config-form">
        <fieldset class="mode-picker">
          <legend class="sr-only">翻译方式</legend>
          <label
            ><input
              type="radio"
              name="translation-mode"
              value="free"
              checked
            /><span
              ><strong>免费翻译</strong><small>不用登录，不用 Key</small></span
            ></label
          >
          <label
            ><input type="radio" name="translation-mode" value="ai" /><span
              ><strong>AI 翻译</strong><small>用自己的 Key</small></span
            ></label
          >
        </fieldset>
        <p id="free-description" class="mode-description">
          先免费读起来。英文表达由规则挑选，中文由翻译服务提供。
        </p>
        <section id="ai-settings" hidden>
          <div class="field">
            <label for="ai-key">你的 DeepSeek API Key</label
            ><input
              id="ai-key"
              type="password"
              autocomplete="off"
              spellcheck="false"
              maxlength="512"
              placeholder="把 Key 粘贴在这里"
            />
            <p class="help">
              只保存在这个浏览器。AI 费用由你自己的服务商收取。
            </p>
          </div>
          <details class="advanced">
            <summary>高级设置 · 其他 AI 服务 / 模型</summary>
            <div class="advanced-body">
              <div class="field">
                <label for="ai-base-url">API 地址（Base URL）</label
                ><input
                  id="ai-base-url"
                  type="url"
                  value="https://api.deepseek.com/v1"
                  spellcheck="false"
                />
                <p class="help">支持兼容 OpenAI 格式的服务。</p>
              </div>
              <div class="field">
                <label for="ai-model">模型名称</label
                ><input
                  id="ai-model"
                  type="text"
                  list="model-list"
                  maxlength="200"
                  placeholder="留空，自动选择"
                  spellcheck="false"
                /><datalist id="model-list"></datalist>
                <p class="help">一般不用填写。测试连接后也可以从列表选择。</p>
              </div>
            </div>
          </details>
        </section>
        <div class="preferences-grid">
          <div class="field">
            <label for="retention">保留多少英文</label
            ><select id="retention">
              <option value="low">少一点</option>
              <option value="medium" selected>适中</option>
              <option value="high">多一点</option>
            </select>
          </div>
          <div class="field">
            <label for="gloss-mode">中文释义</label
            ><select id="gloss-mode">
              <option value="all">全部显示</option>
              <option value="first" selected>每个词首次显示</option>
              <option value="click">点击词语查看</option>
            </select>
          </div>
        </div>
        <div class="button-row">
          <button class="primary" type="submit" id="save" disabled>
            使用免费翻译</button
          ><button id="test" type="button" hidden>测试连接</button>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <footer class="settings-footer">
        <p>文章和收藏存在本机，不会同步到网站。</p>
        <button id="library" class="text-button" type="button">
          打开文章与收藏 →
        </button>
      </footer>
      <details class="advanced privacy-details">
        <summary>正文和 Key 会发到哪里？</summary>
        <p class="help">
          只有点击翻译才会发送选定正文。免费模式发给免费翻译服务；AI
          模式直接发给你设置的 AI 服务。Key
          不会交给正在阅读的网页，也不会上传到语境网站。清除浏览器插件数据或卸载插件会删除本机记录。
        </p>
      </details>
    </main>
  </body>
</html>
