[build]
  command = "npm run db:generate && npm run build:web"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  SERVER_AI_ENABLED = "false"

# Netlify detects Next.js and installs its official runtime automatically.
# Keep the repository root as the base directory; the build includes Read Along.

# Read Along belongs to speaking. Resolve its exact alias at the CDN, since
# the Next.js function does not contain public assets. Contextual reading at
# / and /read, listening, and /speak/practice remain Next.js pages.
[[redirects]]
  from = "/speak"
  to = "/read-along/index.html"
  status = 200
  force = true
